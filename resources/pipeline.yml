resources:
  pipelines:
    inspectiq_dlt:
      name: inspectiq-dlt
      catalog: ${var.catalog}
      target: ${var.schema}
      channel: CURRENT
      photon: true
      development: true
      clusters:
        - label: default
          autoscale:
            min_workers: 1
            max_workers: 2
      libraries:
        - notebook:
            path: ../notebooks/02b_ingest_and_clean.py
        - notebook:
            path: ../notebooks/02c_build_gold.py
